<!DOCTYPE html>
<html lang="en">
<head>
    <title>my animal fact file</title>
    <style>
      /*page bacground - sets the color and font for the whole page*/
      body{
        background-color:darkgreen;
        font-family:arial, sans-serif;
      }

      .fact-file{
        background-color:lightyellow;
        color:darkslategray;
        width:260;
        padding:25;
        border:4px solid forestgreen;
        margin:30;
      } 

      .animal-name{
        color:forestgreen;
        font-size:22;
      }

      .detail{
        color:darkslategray;
      }

      .cool-fact{
        color:darkorange;
        font-style:italic;
      }

    </style>
</head>
<body>
    <div class="fact-file">
          <h2 class="animal-name">snow leopard</h2>
          <p class="detail">type: big cat</p>
          <p class="detail">lives in: mountain ranges of centra asia</p>
          <p class="detail">diet: deer, goat and wild sheep</p>
          <p class="cool-fact">cool-fact:can leap upto 15 metres in 1 jump</p>
          
    </div>
</body>
</html>
